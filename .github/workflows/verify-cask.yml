name: Verify cask

# **手動でしか走らない。** cask が実際にインストールでき、
# インストールされたアプリが Gatekeeper を通るかを実機の macOS で見る。
#
# 存在理由は、この tap を保守している端末が Windows で
# `brew` を 1 度も実行できないこと。cask を書いた側が動作を
# 確かめられないまま配るのを避けるための唯一の経路。
#
# **`spctl` が本命**。署名の構造物が入っていることと、
# Gatekeeper が実際に受け入れることは別の主張で、
# 前者はファイルを見れば分かるが後者は macOS に訊くしかない。
on:
  workflow_dispatch:
    inputs:
      cask:
        description: "Cask token to verify (fuseforks / lorekeel)"
        required: true
        default: "fuseforks"

jobs:
  verify:
    runs-on: macos-latest
    steps:
      # **完全修飾名で呼ぶ。** tap しただけでは信頼は与えられず、
      # 短い名前は "Refusing to load cask ... from untrusted tap" で拒否される。
      # 完全修飾は「その cask だけを信頼する」の意味になる。
      # 利用者へ配る手順もこの形でなければ動かない。
      - name: Tap and parse
        run: |
          brew tap betyourluck/tap
          # info はここで cask の Ruby を評価するので、構文と DSL の誤りは
          # インストールを試みる前にここで落ちる。
          brew info --cask "betyourluck/tap/${{ inputs.cask }}"

          # **`.app` 名は cask から引く。トークンからは導けない** —
          # `fuseforks` → `fuseforks.app` だが `kataribe` → `Kataribe.app` で
          # 大小が違う（`.app` 名は Tauri の productName がそのまま出る）。
          # cask の `app` スタンザを単一真実源にすれば、cask が増えても
          # この workflow は触らなくてよい。
          APP=$(brew info --json=v2 --cask "betyourluck/tap/${{ inputs.cask }}"             | jq -er '.casks[0].artifacts[] | select(.app) | .app[0]')
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "app artifact: $APP"

      # **quarantine を外さない。** Homebrew は既定でダウンロードした
      # cask に検疫属性を付ける。外して入れると Gatekeeper の判定を
      # 迂回してしまい、この workflow の目的そのものが消える。
      - name: Install
        run: brew install --cask "betyourluck/tap/${{ inputs.cask }}"

      - name: What landed
        run: |
          ls -la "/Applications/$APP" || ls -la /Applications

      - name: Code signature
        run: codesign -dvv "/Applications/$APP"

      # 公証チケットがアプリへ綴じ込まれているか。綴じ込まれていれば
      # 起動時に Apple へ問い合わせずに検証できる（オフラインでも開く）。
      - name: Notarization ticket is stapled
        run: xcrun stapler validate "/Applications/$APP"

      # 本命。`source=Notarized Developer ID` が出れば、
      # 署名が入っているだけでなく Gatekeeper が受け入れている。
      - name: Gatekeeper assessment
        run: spctl -a -vv "/Applications/$APP"

      # homebrew-cask の CI が回すのと同じ検査。将来公式へ出すときの
      # 距離が測れる。ここでは落とさない（tap 固有の指摘が混ざるため）。
      - name: brew audit (informational)
        continue-on-error: true
        run: brew audit --cask --online --strict "betyourluck/tap/${{ inputs.cask }}"
